<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/cad_ciclista.js"></script>
    <title>cadastro ciclista</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;
            <a href="./cad_ciclista.html">Cadastrar Ciclista</a>
            <a href="./login.html">Login</a>
        </nav>
    </header>
    <main>
        <form>
            <label for="nome">Nome do Ciclista</label><br>
            <input type="text" id="nome" placeholder="nome" required><br>

            <label for="email">Email do Ciclista</label><br>
            <input type="text" id="email" placeholder="email" required><br>

            <label for="senha">Senha do Ciclista</label><br>
            <input type="text" id="senha" placeholder="senha" required><br><br>
            
            <label for="cpf">cpf do Ciclista</label><br>
            <input type="text" id="cpf" placeholder="cpf" required><br><br>

            <label for="endereco">endereco do Ciclista</label><br>
            <input type="text" id="endereco" placeholder="endereco" required><br><br>

            <label for="celular">celular do Ciclista</label><br>
            <input type="text" id="celular" placeholder="celular" required><br><br>

            <button type="submit" id="btn_cadastrar">Cadastrar</button><br><br>
        </form>
        <div id="resposta_cad_ciclista"></div><br>
    </main>
</body>
</html>
